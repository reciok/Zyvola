<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zyvola Creative | Arquitectura Premium de Portfolio Creativo</title>
    <meta
      name="description"
      content="Zyvola Creative es una categoría premium para generación de ideas, conceptos visuales y arquitectura audiovisual."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://zyvola.com/creative" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" /><noscript><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" /><noscript><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript></noscript>
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body data-page="creative" data-category="creative" data-depth="1">
    <div id="site-header"></div>

    <main class="main">
      <nav class="breadcrumbs" aria-label="Miga de pan">
        <div class="container">
          <ol>
            <li><a href="../index.html">Inicio</a></li>
            <li aria-current="page">Creative</li>
          </ol>
        </div>
      </nav>

      <section class="hero">
        <div class="container hero-grid reveal">
          <p id="category-kicker" class="kicker">Categoría / Creative</p>
          <h1 id="category-title">Zyvola Creative</h1>
          <p id="category-description" class="lead"></p>
          <div id="category-quick-links" class="quick-links"></div>
        </div>
      </section>

      <section class="section">
        <div class="container reveal">
          <h2>Grid Creativo</h2>
          <p class="muted">Sistema creativo modular con consistencia de marca y jerarquía operativa.</p>
          <div class="filters">
            <input id="category-search" class="input" type="search" placeholder="Buscar marcadores creativos" />
            <select id="category-filter" class="select" aria-label="Filtrar por tipo creativo">
              <option value="all">Todos</option>
            </select>
          </div>
          <div id="category-grid" class="cards"></div>
        </div>
      </section>

      <section class="section">
        <div class="container reveal">
          <div class="section-head">
            <div>
              <h2>Subpáginas</h2>
              <p class="muted">Ramas internas para escalar flujos creativos de forma estructurada.</p>
            </div>
          </div>
          <div id="subcategory-grid" class="cards"></div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <article class="cta reveal">
            <h2 id="category-cta-title"></h2>
            <p id="category-cta-copy" class="lead"></p>
            <a id="category-cta-link" class="button" href="#">Explorar</a>
          </article>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>

    <script defer src="../assets/js/pages.js"></script>
    <script defer src="../assets/js/site.js"></script>
  </body>
</html>
